name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'examples/embedding/**'
      - 'package.json'
      - 'package-lock.json'
      - '.laranex-schema-allowlist.json'
      - 'src/scan.ts'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'examples/embedding/**'
      - 'package.json'
      - 'package-lock.json'
      - '.laranex-schema-allowlist.json'
      - 'src/scan.ts'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .gh-page/package-lock.json
      - name: Install the exact laranex-schema-viewer-ui version the demo serves
        run: npm ci --ignore-scripts
      - name: Install documentation dependencies
        working-directory: .gh-page
        run: npm ci
      - name: Test, build, and verify production links
        working-directory: .gh-page
        run: npm run check
      # The published site holds no schema document but the two allowlisted synthetic demo snapshots: any non-zero
      # exit (exposure, uncertain or incomplete scan) fails.
      - name: Scan the built site for schema snapshots
        run: |
          npm run build
          node dist/cli.js scan --artifacts .gh-page/.vitepress/dist --report "$RUNNER_TEMP/scan-site.json"
      - name: Upload the scan report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scan-report-site
          path: ${{ runner.temp }}/scan-site.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .gh-page/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
