name: Publish to npm

# Runs when a GitHub release vX.Y.Z is published. The full release test matrix must pass, the tag must match
# package.json, the version must not already be on npm, every dependency must be an exact registry version, and the
# repository and the packed package must hold no schema snapshot before npm Trusted Publishing (OIDC) publishes it
# with provenance. No npm token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      matrix: release

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/node-schema-viewer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the release tag and that the version is new
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
          if npm view "node-schema-viewer@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} is already on npm"; exit 1
          fi
      - run: npm ci
      - run: npm run check:release
      - name: Scan the repository and the packed package for schema snapshots
        run: |
          npm run build
          node dist/cli.js scan --tracked --untracked --report "$RUNNER_TEMP/scan-tree.json"
          mkdir "$RUNNER_TEMP/scan-pack"
          npm pack --pack-destination "$RUNNER_TEMP/scan-pack"
          tar -xzf "$RUNNER_TEMP"/scan-pack/node-schema-viewer-*.tgz -C "$RUNNER_TEMP/scan-pack"
          node dist/cli.js scan --artifacts "$RUNNER_TEMP/scan-pack/package" --report "$RUNNER_TEMP/scan-package.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.findings.length) { console.error("The packed package holds schema documents"); process.exit(1); }' "$RUNNER_TEMP/scan-package.json"
      - name: Upload the scan reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scan-reports-publish
          path: ${{ runner.temp }}/scan-*.json
          if-no-files-found: ignore
          retention-days: 7
      # Trusted Publishing needs npm 11.5.1 or later. prepublishOnly runs the release guard again.
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public
