name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and release guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:release

  test:
    # The full suite, with the introspection tests against disposable servers (tests/databases/compose.yaml; synthetic
    # schemas and throwaway credentials only). 22.13.0 is the engines floor.
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22.x', '24.x', '26.x']
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_PASSWORD: lsv-admin, POSTGRES_DB: lsv}
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4.6
        env: {MYSQL_ROOT_PASSWORD: lsv-admin, MYSQL_DATABASE: lsv}
        ports: ['53306:3306']
        options: --health-cmd "mysqladmin ping -plsv-admin" --health-interval 5s --health-retries 30
      mariadb:
        image: mariadb:11.4.8
        env: {MARIADB_ROOT_PASSWORD: lsv-admin, MARIADB_DATABASE: lsv}
        ports: ['53307:3306']
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 30
    env:
      LSV_TEST_POSTGRES_URL: postgresql://postgres:lsv-admin@127.0.0.1:55432/lsv
      LSV_TEST_MYSQL_URL: mysql://root:lsv-admin@127.0.0.1:53306/lsv
      LSV_TEST_MARIADB_URL: mysql://root:lsv-admin@127.0.0.1:53307/lsv
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  container:
    # Container isolation (tests/containers/README.md): the image holds this commit's packed package on Node.js 24;
    # the host runs 22, where container isolation is required, and 24.
    name: Container isolation, host Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The tests run every container with --pull never, and one builds a derived image from the base image itself,
      # so the base image must be in the local image store, not only in the builder's cache.
      - name: Pull the base image
        run: docker pull node:24-slim
      - name: Build the lsv-node-test image from the packed package
        run: |
          image="$RUNNER_TEMP/lsv-image"
          mkdir "$image"
          npm pack --pack-destination "$image"
          cp tests/containers/Dockerfile "$image/"
          docker build -t lsv-node-test "$image"
      - run: npm test
        env:
          LSV_TEST_CONTAINER_IMAGE: lsv-node-test
