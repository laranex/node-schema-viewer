name: tests

# Two matrices (AGENTS.md, "CI and supported versions"):
# - pr: pull requests and branch pushes. Node.js 24 (LTS) with every database engine and container isolation,
#   22.13.0 (the engines floor) and 26 (process isolation; Current until it enters LTS on 2026-10-28).
# - release: pushes to main, manual runs and callers (a publish workflow uses `matrix: release`): every supported
#   Node.js line with every database engine, container isolation on 22 and 24, the embedding examples on the floor and
#   on 24.
# The 24.x job of both matrices also scans the repository and the packed package for schema snapshots.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      matrix:
        description: Which matrix to run
        type: choice
        options: [release, pr]
        default: release
  workflow_call:
    inputs:
      matrix:
        description: pr or release
        type: string
        default: release

permissions:
  contents: read

jobs:
  plan:
    name: Select the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      examples: ${{ steps.select.outputs.examples }}
    steps:
      - id: select
        env:
          MODE: ${{ inputs.matrix || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release') || 'pr' }}
        run: |
          case "$MODE" in
            release)
              tests='[
                {"node": "22.13.0", "role": "minimum supported", "databases": true, "container": false},
                {"node": "22.x", "role": "LTS", "databases": true, "container": true},
                {"node": "24.x", "role": "LTS", "databases": true, "container": true},
                {"node": "26.x", "role": "Current, process isolation", "databases": true, "container": false}
              ]'
              examples='["22.13.0", "24.x"]' ;;
            pr)
              tests='[
                {"node": "24.x", "role": "LTS", "databases": true, "container": true},
                {"node": "22.13.0", "role": "minimum supported", "databases": false, "container": false},
                {"node": "26.x", "role": "Current, process isolation", "databases": false, "container": false}
              ]'
              examples='["24.x"]' ;;
            *) echo "Unknown matrix: $MODE (expected pr or release)"; exit 1 ;;
          esac
          {
            echo "tests=$(jq -c . <<< "$tests")"
            echo "examples=$(jq -c . <<< "$examples")"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck and release guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:release

  test:
    # The full suite (contract, conformance, parity, packaging and the security regression tests); each version skips
    # what does not apply to it (process isolation runs on 26, its refusal on 22 and 24). Database tests run against
    # disposable servers (tests/databases/compose.yaml; synthetic schemas and throwaway credentials only) where
    # `databases` is set; container isolation (tests/containers/README.md) where `container` is set.
    name: Node.js ${{ matrix.node }} (${{ matrix.role }}${{ matrix.databases && ', databases' || '' }}${{ matrix.container && ', container isolation' || '' }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    services:
      # An empty image skips the service.
      postgres:
        image: ${{ matrix.databases && 'postgres:17.6' || '' }}
        env: {POSTGRES_PASSWORD: lsv-admin, POSTGRES_DB: lsv}
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: ${{ matrix.databases && 'mysql:8.4.6' || '' }}
        env: {MYSQL_ROOT_PASSWORD: lsv-admin, MYSQL_DATABASE: lsv}
        ports: ['53306:3306']
        options: --health-cmd "mysqladmin ping -plsv-admin" --health-interval 5s --health-retries 30
      mariadb:
        image: ${{ matrix.databases && 'mariadb:11.4.8' || '' }}
        env: {MARIADB_ROOT_PASSWORD: lsv-admin, MARIADB_DATABASE: lsv}
        ports: ['53307:3306']
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 30
    env:
      # The tests skip a server whose variable is empty.
      LSV_TEST_POSTGRES_URL: ${{ matrix.databases && 'postgresql://postgres:lsv-admin@127.0.0.1:55432/lsv' || '' }}
      LSV_TEST_MYSQL_URL: ${{ matrix.databases && 'mysql://root:lsv-admin@127.0.0.1:53306/lsv' || '' }}
      LSV_TEST_MARIADB_URL: ${{ matrix.databases && 'mysql://root:lsv-admin@127.0.0.1:53307/lsv' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The repository tracks no schema document but its allowlisted synthetic fixtures (.laranex-schema-allowlist.json)
      # and the published package holds none: any non-zero exit (exposure, uncertain or incomplete scan) fails. Once, on
      # 24.x in both matrices: the scan does not depend on the Node.js version.
      - name: Scan the repository and the packed package for schema snapshots
        if: matrix.node == '24.x'
        run: |
          npm run build
          node dist/cli.js scan --tracked --untracked --report "$RUNNER_TEMP/scan-tree.json"
          mkdir "$RUNNER_TEMP/scan-pack"
          npm pack --pack-destination "$RUNNER_TEMP/scan-pack"
          tar -xzf "$RUNNER_TEMP"/scan-pack/node-schema-viewer-*.tgz -C "$RUNNER_TEMP/scan-pack"
          node dist/cli.js scan --artifacts "$RUNNER_TEMP/scan-pack/package" --report "$RUNNER_TEMP/scan-package.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.findings.length) { console.error("The packed package holds schema documents"); process.exit(1); }' "$RUNNER_TEMP/scan-package.json"
      - name: Upload the scan reports
        if: failure() && matrix.node == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: scan-reports-${{ matrix.node }}
          path: ${{ runner.temp }}/scan-*.json
          if-no-files-found: ignore
          retention-days: 7
      # The tests run every container with --pull never, and one builds a derived image from the base image itself,
      # so the base image must be in the local image store, not only in the builder's cache.
      - name: Pull the base image
        if: matrix.container
        run: docker pull node:24-slim
      - name: Build the lsv-node-test image from the packed package
        if: matrix.container
        run: |
          image="$RUNNER_TEMP/lsv-image"
          mkdir "$image"
          npm pack --pack-destination "$image"
          cp tests/containers/Dockerfile "$image/"
          docker build -t lsv-node-test "$image"
          # Set only here: the container tests skip when the variable is unset, not when it is empty.
          echo "LSV_TEST_CONTAINER_IMAGE=lsv-node-test" >> "$GITHUB_ENV"
      - run: npm test

  examples:
    # The embedding examples (examples/embedding: Express, Fastify, NestJS, Next.js) against this package packed from
    # the checkout, with their authentication and exposure tests.
    name: Embedding examples, Node.js ${{ matrix.node }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.plan.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/embedding/package-lock.json
      - run: npm ci
      - run: npm run test:examples
